<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>2026馬年美食製作遊戲 - 攤位版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase SDK (版本 9.6.0 compat 版本，包含 Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Microsoft JhengHei', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('images/bg.png') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            touch-action: manipulation; /* 禁用雙擊縮放 */
            -ms-touch-action: manipulation; /* IE11支持 */
        }
        
        .container {
            width: 100%;
            height: 100%;
            padding: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* 裝飾元素 */
        .decoration {
            position: absolute;
            font-size: 2rem;
            color: #ffd700;
            z-index: 1;
            animation: float 3s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .dec-1 { top: 20px; left: 20px; }
        .dec-2 { top: 20px; right: 20px; }
        .dec-3 { bottom: 20px; left: 20px; }
        .dec-4 { bottom: 20px; right: 20px; }
        
        .year-badge {
            background: linear-gradient(45deg, #8B4513, #ffd700, #D2691E);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px auto;
            display: inline-block;
            border: 3px solid #ffd700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            z-index: 2;
            position: relative;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .header {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }
        
        .header h1 {
            color: #ffd700; /* 改為金黃色 */
            font-size: 2.2rem;
            text-shadow: 2px 2px 0 #8B4513; /* 修改陰影顏色為深棕色 */
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .header p {
            color: #ffd700; /* 改為金黃色 */
            font-size: 1.1rem;
            line-height: 1.4;
            max-width: 90%;
            margin: 0 auto;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3); /* 添加陰影增強可讀性 */
        }
        
        /* 遊戲區域 */
        .game-area {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        /* 主菜單 */
        .main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: auto;
            width: 100%;
            max-width: 400px;
        }
        
        .menu-button {
            background-color: #8B4513;
            color: white;
            border: none;
            padding: 18px 25px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            border: 5px solid #ffd700;
            box-shadow: 0 8px 0 #5D2906;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            width: 100%;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        
        .menu-button:hover::before {
            left: 100%;
        }
        
        .menu-button:hover {
            background-color: #5D2906;
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #5D2906;
        }
        
        .menu-button:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #5D2906;
        }
        
        .menu-button i {
            font-size: 1.8rem;
        }
        
        /* 食物選擇區域 */
        .food-selection {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            overflow-x: auto;
        }
        
        .food-selection-title {
            text-align: center;
            color: #ffd700; /* 改為金黃色 */
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: bold;
            width: 100%;
            text-shadow: 1px 1px 0 #8B4513; /* 修改陰影顏色為深棕色 */
            flex-shrink: 0;
        }
        
        /* 3x3佈局，不使用網格 */
        .food-cards-container {
            display: flex;
            flex-wrap: wrap;
            width: 504px; /* 3 * 140px * 1.2 */
            height: 504px; /* 3 * 140px * 1.2 */
            margin: 0 auto;
            padding: 0;
            overflow-y: auto;
            justify-content: flex-start;
            align-content: flex-start;
        }
        
        .food-card {
            background: linear-gradient(145deg, #fff9e6, #ffecb3);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 4px solid #ffd700;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 140px;
            height: 140px;
            margin: 0;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .food-card:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
            border-color: #8B4513;
        }
        
        .food-card.selected {
            border-color: #8B4513;
            background: linear-gradient(145deg, #ffeaa7, #ffd93d);
            transform: translateY(-3px);
        }
        
        .food-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: #8B4513;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .food-name {
            font-size: 1.2rem;
            color: #8B4513;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .food-desc {
            color: #666;
            font-size: 0.8rem;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        
        .food-stats {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 0.8rem;
            margin-top: auto;
        }
        
        /* 遊戲互動區域 */
        .interaction-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        
        .steps-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .step-dot {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            color: #888;
            border: 2px solid #ddd;
            transition: all 0.3s;
        }
        
        .step-dot.active {
            background-color: #ffd700;
            color: #8B4513;
            border-color: #8B4513;
            transform: scale(1.1);
        }
        
        .step-dot.completed {
            background-color: #8B4513;
            color: white;
            border-color: #ffd700;
        }
        
        /* 製作區保留白色背景和黃色邊框 */
        .interaction-area {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 15px;
            border: 8px solid #ffd700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex: 1;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }
        
        .step-title {
            text-align: center;
            color: #8B4513;
            font-size: 1.6rem;
            margin-bottom: 8px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .step-instruction {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding: 0 10px;
            line-height: 1.4;
            flex-shrink: 0;
        }
        
        /* 互動內容區域 */
        .interaction-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
            flex: 0 0 auto;
        }
        
        /* 材料容器區域 - 修改為500px寬度和120px高度 */
        .ingredients-container {
            width: 500px; /* 足夠展示6個材料卡片 */
            height: 120px; /* 1.5 * 80px */
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            flex-wrap: nowrap;
            justify-content: flex-start;
            align-items: center;
            margin: 0 auto;
            padding: 0;
        }
        
        .ingredients {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            padding: 5px;
        }
        
        .ingredient {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            border: 3px solid #ccc;
            cursor: pointer;
            transition: all 0.3s;
            padding: 8px;
            user-select: none;
            position: relative;
            flex-shrink: 0;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .ingredient:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .ingredient.correct {
            border-color: #4CAF50;
            background-color: rgba(76, 175, 80, 0.1);
        }
        
        .ingredient.wrong {
            border-color: #f44336;
            background-color: rgba(244, 67, 54, 0.1);
        }
        
        .ingredient.placed {
            opacity: 0.6;
            border-style: dashed;
            border-color: #ffd700;
            background-color: #f9f9f9;
            cursor: default;
        }
        
        .ingredient.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .ingredient.disabled:hover {
            transform: none;
            box-shadow: none;
        }
        
        .ingredient-icon {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        
        .ingredient-name {
            font-size: 0.8rem;
            color: #555;
            text-align: center;
            font-weight: bold;
        }
        
        /* 進度條步驟樣式 */
        .progress-container {
            width: 90%;
            height: 25px;
            background-color: #eee;
            border-radius: 15px;
            margin: 20px 0;
            overflow: hidden;
            border: 3px solid #ddd;
        }
        
        .progress-bar {
            height: 100%;
            background-color: #ffd700;
            width: 0%;
            transition: width 0.5s;
            border-radius: 15px;
        }
        
        .progress-text {
            font-size: 1.2rem;
            color: #8B4513;
            font-weight: bold;
            margin-top: 10px;
        }
        
        /* 計數器步驟樣式 */
        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 25px 0;
            font-size: 1.5rem;
            color: #8B4513;
        }
        
        .counter-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #8B4513;
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 3px solid #ffd700;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .counter-button:hover {
            background-color: #5D2906;
            transform: scale(1.05);
        }
        
        .counter-button:active {
            transform: scale(0.95);
        }
        
        .counter-button:disabled {
            background-color: #aaa;
            border-color: #777;
            cursor: not-allowed;
            transform: none;
        }
        
        .counter-value {
            min-width: 70px;
            text-align: center;
            font-weight: bold;
            font-size: 2.2rem;
            background-color: #fff9e6;
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #ffd700;
        }
        
        /* 完成畫面 */
        .completion-screen {
            text-align: center;
            padding: 15px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .completion-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: #8B4513;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .completion-message {
            color: #8B4513;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .completion-desc {
            color: #666;
            font-size: 1rem;
            margin-bottom: 20px;
            max-width: 90%;
            line-height: 1.4;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* 導航按鈕 */
        .navigation-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
            padding: 0 15px;
            z-index: 10;
            position: relative;
            bottom: auto;
        }
        
        .nav-button {
            background-color: #ffd700;
            color: #8B4513;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            border: 3px solid #8B4513;
            min-width: 120px;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .nav-button:hover {
            background-color: #8B4513;
            color: #ffd700;
            transform: scale(1.05);
        }
        
        .nav-button:disabled {
            background-color: #aaa;
            color: #777;
            border-color: #777;
            cursor: not-allowed;
            transform: none;
        }
        
        .action-button {
            background-color: #8B4513;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            font-weight: bold;
            border: 4px solid #ffd700;
            box-shadow: 0 6px 0 #5D2906;
            min-width: 150px;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .action-button:hover {
            background-color: #5D2906;
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #5D2906;
        }
        
        .action-button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #5D2906;
        }
        
        .action-button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 6px 0 #777;
            border-color: #777;
        }
        
        /* 排行榜 */
        .leaderboard-container {
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 15px;
            border: 8px solid #ffd700;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        .leaderboard-title {
            text-align: center;
            color: #8B4513;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .leaderboard-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .leaderboard-tab {
            background-color: #ffd700;
            color: #8B4513;
            border: 2px solid #8B4513;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all 0.3s;
            min-width: 80px;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .leaderboard-tab:hover {
            background-color: #8B4513;
            color: #ffd700;
        }
        
        .leaderboard-tab.active {
            background-color: #8B4513;
            color: #ffd700;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .leaderboard-table-container {
            flex: 1;
            overflow: auto;
        }
        
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        
        .leaderboard-table th {
            background-color: #8B4513;
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 1rem;
            position: sticky;
            top: 0;
        }
        
        .leaderboard-table td {
            padding: 12px;
            border-bottom: 2px solid #ffd700;
            font-size: 0.9rem;
        }
        
        .leaderboard-table tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.7);
        }
        
        .leaderboard-table tr:hover {
            background-color: rgba(255, 215, 0, 0.2);
        }
        
        .rank-1 { color: #ffd700; font-weight: bold; font-size: 1.1rem; }
        .rank-2 { color: #c0c0c0; font-weight: bold; font-size: 1rem; }
        .rank-3 { color: #cd7f32; font-weight: bold; font-size: 1rem; }
        
        /* 姓名輸入表單 */
        .name-form {
            background-color: white;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid #ffd700;
            max-width: 90%;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            z-index: 100;
        }
        
        .name-form h2 {
            color: #8B4513;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        
        .name-input {
            width: 100%;
            padding: 12px;
            font-size: 1.3rem;
            border: 3px solid #ffd700;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            color: #8B4513;
            transition: all 0.3s;
        }
        
        .name-input:focus {
            outline: none;
            border-color: #8B4513;
            box-shadow: 0 0 10px rgba(139, 69, 19, 0.3);
            transform: scale(1.02);
        }
        
        .character-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .character-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background-color: white;
            transition: all 0.3s;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .character-option:hover {
            transform: scale(1.05);
            border-color: #8B4513;
        }
        
        .character-option.selected {
            border-color: #8B4513;
            background-color: #ffd700;
            transform: scale(1.05);
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .submit-button {
            background-color: #8B4513;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.3rem;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            border: 4px solid #ffd700;
            box-shadow: 0 6px 0 #5D2906;
            width: 100%;
            margin-top: 10px;
            touch-action: manipulation; /* 禁用雙擊縮放 */
        }
        
        .submit-button:hover {
            background-color: #5D2906;
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #5D2906;
        }
        
        .submit-button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #5D2906;
        }
        
        /* 隱藏類 */
        .hidden {
            display: none !important;
        }
        
        /* 錯誤訊息 */
        .error-message {
            color: #f44336;

        // ============================================
        // Firebase初始化 (Realtime Database)
        // ============================================
        async function initializeFirebase() {
            try {
                // 顯示加載指示器
                loadingIndicator.classList.remove('hidden');
                
                // 初始化Firebase
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                
                // 測試連接
                await db.ref('.info/connected').once('value');
                
                firebaseInitialized = true;
                console.log("Firebase Realtime Database 初始化成功");
                
                // 更新同步狀態
                syncStatus.textContent = "數據已同步";
                syncStatus.style.color = "#4CAF50";
                
                // 隱藏加載指示器
                setTimeout(() => {
                    loadingIndicator.classList.add('hidden');
                }, 500);
                
                return true;
            } catch (error) {
                console.error("Firebase Realtime Database 初始化失敗:", error);
                firebaseInitialized = false;
                
                // 更新同步狀態
                syncStatus.textContent = "數據同步失敗，使用本地數據";
                syncStatus.style.color = "#f44336";
                
                // 隱藏加載指示器
                setTimeout(() => {
                    loadingIndicator.classList.add('hidden');
                }, 500);
                
                return false;
            }
        }
        
        // ============================================
        // 遊戲初始化
        // ============================================
        
        // 從本地存儲加載遊戲數據
        function loadGameData() {
            const savedData = localStorage.getItem('foodGameLeaderboard');
            if (savedData) {
                try {
                    leaderboardData = JSON.parse(savedData);
                } catch (e) {
                    console.error("加載排行榜數據錯誤:", e);
                    leaderboardData = [];
                }
            } else {
                leaderboardData = [];
            }
            
            // 加載音效設置
            const soundSetting = localStorage.getItem('foodGameSound');
            if (soundSetting !== null) {
                soundEnabled = soundSetting === 'true';
            }
            updateSoundToggle();
        }
        
        // 保存遊戲數據到本地存儲
        function saveGameData() {
            try {
                localStorage.setItem('foodGameLeaderboard', JSON.stringify(leaderboardData));
                localStorage.setItem('foodGameSound', soundEnabled.toString());
            } catch (e) {
                console.error("保存遊戲數據錯誤:", e);
            }
        }
        
        // 初始化遊戲
        async function initGame() {
            // 顯示加載指示器
            loadingIndicator.classList.remove('hidden');
            
            // 加載遊戲數據
            loadGameData();
            
            // 初始化Firebase
            await initializeFirebase();
            
            // 設置事件監聽器
            playButton.addEventListener('click', showFoodSelection);
            leaderboardButton.addEventListener('click', showLeaderboard);
            soundToggle.addEventListener('click', toggleSound);
            
            // 返回按鈕 - 從排行榜返回時刷新頁面
            backToMenuFromSelection.addEventListener('click', showMainMenu);
            backToMenuFromGame.addEventListener('click', showMainMenu);
            
            // 修改排行榜返回按鈕事件，先返回主菜單然後刷新
            backToMenuFromLeaderboard.addEventListener('click', function() {
                if (isProcessingClick) return;
                isProcessingClick = true;
                
                playSound('click-sound');
                
                // 顯示主菜單
                showMainMenu();
                
                // 延遲一小段時間後刷新頁面
                setTimeout(() => {
                    location.reload();
                }, 300);
                
                setTimeout(() => { isProcessingClick = false; }, 300);
            });
            
            // 導航按鈕
            nextStepButton.addEventListener('click', goToNextStep);
            prevStepButton.addEventListener('click', goToPrevStep);
            
            // 提交分數
            submitScoreButton.addEventListener('click', submitScore);
            
            // 角色選擇
            document.querySelectorAll('.character-option').forEach(option => {
                option.addEventListener('click', function() {
                    if (isProcessingClick) return;
                    isProcessingClick = true;
                    
                    document.querySelectorAll('.character-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedCharacter = this.dataset.char;
                    
                    playSound('click-sound');
                    
                    setTimeout(() => { isProcessingClick = false; }, 300);
                });
            });
            
            // 排行榜標籤
            leaderboardTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    if (isProcessingClick) return;
                    isProcessingClick = true;
                    
                    const food = this.dataset.food;
                    leaderboardTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    updateLeaderboard(food);
                    
                    playSound('click-sound');
                    
                    setTimeout(() => { isProcessingClick = false; }, 300);
                });
            });
            
            // 刷新排行榜按鈕
            refreshLeaderboardButton.addEventListener('click', function() {
                if (isProcessingClick) return;
                isProcessingClick = true;
                
                const activeTab = document.querySelector('.leaderboard-tab.active');
                const foodType = activeTab ? activeTab.dataset.food : 'all';
                updateLeaderboard(foodType);
                
                playSound('click-sound');
                
                setTimeout(() => { isProcessingClick = false; }, 300);
            });
            
            // 清除排行榜按鈕
            clearLeaderboardButton.addEventListener('click', function() {
                if (isProcessingClick) return;
                isProcessingClick = true;
                
                clearLeaderboard();
                
                setTimeout(() => { isProcessingClick = false; }, 300);
            });
            
            // 勝利視頻結束事件
            victoryVideo.addEventListener('ended', function() {
                victoryVideoContainer.classList.add('hidden');
                leaderboardArea.classList.remove('hidden');
                updateLeaderboard('all');
            });
            
            // 絕對禁用雙擊縮放
            disableDoubleTapZoom();
            
            // 顯示主菜單
            showMainMenu();
            
            // 隱藏加載指示器
            setTimeout(() => {
                loadingIndicator.classList.add('hidden');
            }, 1000);
        }
        
        // 絕對禁用雙擊縮放
        function disableDoubleTapZoom() {
            // 禁用雙擊事件
            document.addEventListener('dblclick', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, { passive: false });
            
            // 禁用手勢縮放
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, { passive: false });
            
            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, { passive: false });
            
            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, { passive: false });
            
            // 防止iOS Safari的雙擊縮放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                }
                lastTouchEnd = now;
            }, { passive: false });
            
            // 防止雙擊事件觸發縮放
            let touchCount = 0;
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                }
            }, { passive: false });
            
            // 防止捏合縮放
            document.addEventListener('touchmove', function(event) {
                if (event.touches.length > 1) {
                    event.preventDefault();
                    event.stopPropagation();
                    return false;
                }
            }, { passive: false });
        }
        
        // ============================================
        // 遊戲功能函數
        // ============================================
        
        // 播放音效
        function playSound(soundId) {
            if (!soundEnabled) return;
            
            try {
                const sound = document.getElementById(soundId);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(e => console.log("音效播放失敗:", e));
                }
            } catch (e) {
                console.log("音效播放錯誤:", e);
            }
        }
        
        // 切換音效
        function toggleSound() {
            soundEnabled = !soundEnabled;
            updateSoundToggle();
            saveGameData();
            playSound('click-sound');
        }
        
        // 更新音效按鈕
        function updateSoundToggle() {
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        }
        
        // 顯示主菜單
        function showMainMenu() {
            if (isProcessingClick) return;
            isProcessingClick = true;
            
            // 隱藏所有區域
            selectionArea.classList.add('hidden');
            interactionArea.classList.add('hidden');
            leaderboardArea.classList.add('hidden');
            nameForm.classList.add('hidden');
            victoryVideoContainer.classList.add('hidden');
            
            // 顯示主菜單
            mainMenu.classList.remove('hidden');
            
            // 重置遊戲狀態
            currentFood = null;
            currentStep = 0;
            gameState = {};
            scoreAlreadySubmitted = false;
            
            // 修復BUG：重置下一步按鈕狀態
            if (nextStepButton) {
                nextStepButton.disabled = false;
                nextStepButton.textContent = "下一步";
            }
            if (prevStepButton) {
                prevStepButton.classList.add('hidden');
            }
            
            playSound('click-sound');
            
            setTimeout(() => { isProcessingClick = false; }, 300);
        }

        function showFoodSelection() {

            mainMenu.classList.add('hidden');

            setTimeout(() => { isProcessingClick = false; }, 300);

            mainMenu.classList.add('hidden');
            leaderboardArea.classList.remove('hidden');
            
            // 更新排行榜
            updateLeaderboard('all');
            
            playSound('click-sound');
            
            setTimeout(() => { isProcessingClick = false; }, 300);

        // 創建美食卡片
        function createFoodCards() {
            selectionArea.innerHTML = '';
            
            // 添加標題
            const title = document.createElement('div');
            title.className = 'food-selection-title';
            title.textContent = '選擇春節美食開始挑戰：';
            selectionArea.appendChild(title);
            
            // 創建卡片容器
            const cardsContainer = document.createElement('div');
            cardsContainer.className = 'food-cards-container';
            
            // 創建每個美食的卡片
            Object.keys(foodSteps).forEach((foodId) => {
                const food = foodSteps[foodId];
                
                const foodCard = document.createElement('div');
                foodCard.className = 'food-card clickable no-select';
                foodCard.dataset.food = foodId;
                
                foodCard.innerHTML = `
                    <div class="food-icon">${food.icon}</div>
                    <div class="food-name">${food.name}</div>
                    <div class="food-desc">${food.desc}</div>
                    <div class="food-stats">
                        <span>步驟: ${food.steps.length}</span>
                    </div>
                `;
                
                // 添加點擊事件
                foodCard.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    if (isProcessingClick) return;
                    isProcessingClick = true;
                    
                    playSound('click-sound');
                    
                    // 更新選中狀態
                    document.querySelectorAll('.food-card').forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                    
                    // 設置當前選中的美食
                    currentFood = foodId;
                    
                    // 開始製作美食
                    setTimeout(() => {
                        startFoodMaking(foodId);
                        isProcessingClick = false;
                    }, 300);
                });
                
                cardsContainer.appendChild(foodCard);
            });
            
            selectionArea.appendChild(cardsContainer);

        // 開始製作美食
        function startFoodMaking(foodType) {
            selectionArea.classList.add('hidden');
            interactionArea.classList.remove('hidden');
            
            // 重置遊戲狀態
            currentStep = 0;
            gameState = {
                clickedIngredients: [],
                progress: 0,
                counter: 0,
                wrongSelections: 0,
                startTime: Date.now(),
                perfect: true
            };
            
            // 重置分數提交狀態
            scoreAlreadySubmitted = false;
            
            // 創建步驟指示器

        // 創建步驟指示器
        function createStepIndicators(foodType) {
            stepsIndicator.innerHTML = '';
            totalSteps = foodSteps[foodType].steps.length;
            
            for (let i = 0; i < totalSteps; i++) {
                const stepDot = document.createElement('div');
                stepDot.className = 'step-dot';

        // 載入步驟
        function loadStep(foodType, stepIndex) {
            currentStep = stepIndex;
            const step = foodSteps[foodType].steps[stepIndex];
            
            // 更新步驟指示器
            updateStepIndicators();
            
            // 更新標題和說明
            stepTitle.textContent = `步驟${stepIndex + 1}: ${step.title}`;
            stepInstruction.textContent = step.instruction;
            
            // 更新互動內容
            interactionContent.innerHTML = '';
            ingredientCounterDisplay.classList.add('hidden');
            
            // 清空訊息區域
            clearMessageArea();
            
            // 根據步驟類型設置interaction-content的高度
            if (step.type === "click") {
                interactionContent.style.height = "96px";
            } else {
                interactionContent.style.height = "auto";
            }
            
            // 根據步驟類型載入不同的互動內容
            switch(step.type) {
                case "click":
                    loadClickStep(step);
                    break;
                case "progress":
                    loadProgressStep(step);
                    break;
                case "counter":
                    loadCounterStep(step);
                    break;
            }
            
            // 更新下一步按鈕文字和狀態
            nextStepButton.textContent = step.nextButton;
            nextStepButton.disabled = true;
            
            // 顯示/隱藏上一步按鈕
            if (stepIndex > 0) {
                prevStepButton.classList.remove('hidden');
            } else {
                prevStepButton.classList.add('hidden');
            }
        }
        
        // 更新步驟指示器
        function updateStepIndicators() {
            document.querySelectorAll('.step-dot').forEach((dot, index) => {
                dot.classList.remove('active', 'completed');
                
                if (index === currentStep) {
                    dot.classList.add('active');
                } else if (index < currentStep) {
                    dot.classList.add('completed');
                }
            });
        }
        
        // 載入點擊步驟
        function loadClickStep(step) {
            // 清空interactionContent
            interactionContent.innerHTML = '';
            
            // 顯示食材計數器
            ingredientCounterDisplay.classList.remove('hidden');
            selectedCountEl.textContent = '0';
            totalIngredientsEl.textContent = step.correctIngredients.length;
            
            // 創建材料容器
            const ingredientsContainer = document.createElement('div');
            ingredientsContainer.className = 'ingredients-container';
            
            const ingredientsDiv = document.createElement('div');
            ingredientsDiv.className = 'ingredients';
            
            // 準備所有材料：正確材料 + 干擾材料
            const allIngredients = [...step.correctIngredients];
            
            // 添加干擾材料
            const numWrongIngredients = Math.max(step.correctIngredients.length, 4);
            const shuffledWrongIngredients = [...wrongIngredients]
                .sort(() => 0.5 - Math.random())
                .slice(0, numWrongIngredients);
            
            allIngredients.push(...shuffledWrongIngredients);
            
            // 隨機排序所有材料
            const shuffledAllIngredients = allIngredients.sort(() => 0.5 - Math.random());
            
            // 創建材料元素
            shuffledAllIngredients.forEach(ingredient => {
                const isCorrect = step.correctIngredients.some(ci => ci.name === ingredient.name);
                
                const ingredientDiv = document.createElement('div');
                ingredientDiv.className = `ingredient clickable no-select`;
                ingredientDiv.dataset.name = ingredient.name;
                ingredientDiv.dataset.correct = isCorrect;
                
                // 添加正確/錯誤樣式
                if (isCorrect) {
                    ingredientDiv.classList.add('correct');
                } else {
                    ingredientDiv.classList.add('wrong');
                }
                
                ingredientDiv.innerHTML = `
                    <div class="ingredient-icon">${ingredient.icon}</div>
                    <div class="ingredient-name">${ingredient.name}</div>
                `;
                
                // 添加點擊事件
                ingredientDiv.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    if (isProcessingClick) return;
                    isProcessingClick = true;
                    
                    handleIngredientClick(this, ingredient, isCorrect, step);
                    
                    setTimeout(() => { isProcessingClick = false; }, 300);
                });
                
                ingredientsDiv.appendChild(ingredientDiv);
            });
            
            ingredientsContainer.appendChild(ingredientsDiv);
            interactionContent.appendChild(ingredientsContainer);
            
            // 重置點擊狀態
            gameState.clickedIngredients = [];
            gameState.wrongSelections = 0;
        }
        
        // 處理材料點擊
        function handleIngredientClick(ingredientDiv, ingredient, isCorrect, step) {
            playSound('click-sound');
            
            // 檢查是否已經點擊過
            if (ingredientDiv.classList.contains('placed') || ingredientDiv.classList.contains('disabled')) {
                return;
            }
            
            if (isCorrect) {
                // 正確材料
                gameState.clickedIngredients.push(ingredient.name);
                ingredientDiv.classList.add('placed');
                ingredientDiv.classList.add('disabled');
                
                // 顯示成功訊息
                showMessage(`✓ 選擇了 ${ingredient.name}`, true);
                
                playSound('correct-sound');
                
                // 更新計數器
                selectedCountEl.textContent = gameState.clickedIngredients.length;
                
                // 檢查是否所有正確材料都已添加
                if (gameState.clickedIngredients.length === step.correctIngredients.length) {
                    nextStepButton.disabled = false;
                    
                    showMessage('🎉 所有材料已準備好！可以繼續下一步了！', true);
                }
            } else {
                // 錯誤材料
                gameState.wrongSelections++;
                gameState.perfect = false;
                
                ingredientDiv.classList.add('disabled');
                
                // 顯示錯誤訊息
                showMessage(`✗ ${ingredient.name} 不是正確材料！`, false);
                
                playSound('wrong-sound');
                
                // 閃爍效果
                ingredientDiv.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    ingredientDiv.style.animation = '';
                }, 500);
            }
        }
        
        // 顯示訊息到訊息區域
        function showMessage(message, isSuccess) {
            const messageElement = document.createElement('div');
            messageElement.className = isSuccess ? 'success-message' : 'error-message';
            messageElement.textContent = message;
            
            // 添加到訊息區域頂部，這樣新訊息會出現在最上方
            messageArea.insertBefore(messageElement, messageArea.firstChild);
            
            // 如果訊息太多，移除最舊的訊息
            const maxMessages = 3;
            while (messageArea.children.length > maxMessages) {
                messageArea.removeChild(messageArea.lastChild);
            }
            
            // 設定3秒後自動移除這條訊息
            setTimeout(() => {
                if (messageElement.parentNode === messageArea) {
                    messageArea.removeChild(messageElement);
                }
            }, 3000);
        }
        
        // 清空訊息區域
        function clearMessageArea() {
            messageArea.innerHTML = '';
        }
        
        // 載入進度條步驟
        function loadProgressStep(step) {
            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-container';
            progressContainer.innerHTML = `
                <div class="progress-bar" id="progress-bar"></div>
            `;
            
            const progressText = document.createElement('div');
            progressText.className = 'progress-text';
            progressText.id = 'progress-text';
            progressText.textContent = '0%';
            
            const actionButton = document.createElement('button');
            actionButton.className = 'action-button clickable';
            actionButton.id = 'action-button';
            actionButton.textContent = step.actionText;
            
            interactionContent.appendChild(progressContainer);
            interactionContent.appendChild(progressText);
            interactionContent.appendChild(actionButton);
            
            // 重置進度狀態
            gameState.progress = 0;
            updateProgressBar();
            
            // 添加點擊事件
            actionButton.addEventListener('click', function() {
                if (isProcessingClick) return;
                isProcessingClick = true;
                
                playSound('click-sound');
                
                const increment = 20;
                
                if (gameState.progress < step.targetProgress) {
                    gameState.progress += increment;
                    if (gameState.progress > step.targetProgress) {
                        gameState.progress = step.targetProgress;
                    }
                    updateProgressBar();
                    
                    // 完成時啟用下一步按鈕
                    if (gameState.progress >= step.targetProgress) {
                        nextStepButton.disabled = false;
                        this.disabled = true;
                    }
                }
                
                setTimeout(() => { isProcessingClick = false; }, 200);
            });
        }
        
        // 載入計數器步驟
        function loadCounterStep(step) {
            const counterDiv = document.createElement('div');
            counterDiv.className = 'counter';
            counterDiv.innerHTML = `
                <button class="counter-button clickable" id="increase-button">+</button>
                <div class="counter-value" id="counter-value">0</div>
            `;
            
            const actionText = document.createElement('div');
            actionText.className = 'step-instruction';
            actionText.textContent = `目標: ${step.targetCount} 次 ${step.actionText}`;
            
            interactionContent.appendChild(actionText);
            interactionContent.appendChild(counterDiv);
            
            // 重置計數器狀態
            gameState.counter = 0;
            updateCounter();
            
            // 添加計數器事件
            const increaseButton = document.getElementById('increase-button');
            increaseButton.addEventListener('click', function() {
                if (isProcessingClick) return;
                isProcessingClick = true;
                
                playSound('click-sound');
                
                if (gameState.counter < step.targetCount) {
                    gameState.counter++;
                    updateCounter();
                    
                    // 完成時啟用下一步按鈕
                    if (gameState.counter >= step.targetCount) {
                        nextStepButton.disabled = false;
                        this.disabled = true;
                    }
                }
                
                setTimeout(() => { isProcessingClick = false; }, 200);
            });
        }
        
        // 更新進度條
        function updateProgressBar() {
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            if (progressBar && progressText) {
                progressBar.style.width = `${gameState.progress}%`;
                progressText.textContent = `${gameState.progress}%`;
                
                // 完成時添加彩色效果
                if (gameState.progress >= 100) {
                    progressBar.classList.add('colorful-progress');
                }
            }

        // 更新計數器
        function updateCounter() {

        // 下一步
        function goToNextStep() {

                loadStep(currentFood, currentStep + 1);
            } else {

                showCompletionScreen();

        // 上一步
        function goToPrevStep() {
            if (isProcessingClick) return;

        // 計算時間倍率
        function calculateTimeMultiplier(timeInSeconds) {
            // 時間倍率計算邏輯：
            // - 30秒內完成: 2.0x 倍率
            // - 60秒內完成: 1.5x 倍率
            // - 90秒內完成: 1.2x 倍率
            // - 120秒內完成: 1.0x 倍率
            // - 超過120秒: 0.8x 倍率
            
            if (timeInSeconds <= 30) {
                return { multiplier: 2.0, description: "神速！" };
            } else if (timeInSeconds <= 60) {
                return { multiplier: 1.5, description: "快速！" };
            } else if (timeInSeconds <= 90) {
                return { multiplier: 1.2, description: "不錯！" };
            } else if (timeInSeconds <= 120) {
                return { multiplier: 1.0, description: "標準" };
            } else {
                return { multiplier: 0.8, description: "稍慢" };
            }
        }
        
        // 顯示完成畫面
        function showCompletionScreen() {
            interactionContent.innerHTML = '';
            stepsIndicator.classList.add('hidden');
            ingredientCounterDisplay.classList.add('hidden');
            prevStepButton.classList.add('hidden');
            nextStepButton.classList.add('hidden');
            
            const completionScreen = document.createElement('div');
            completionScreen.className = 'completion-screen';
            
            // 計算總分
            const timeElapsed = (Date.now() - gameState.startTime) / 1000;
            const timeMultiplierInfo = calculateTimeMultiplier(timeElapsed);
            const timeMultiplier = timeMultiplierInfo.multiplier;
            
            // 基礎分數計算
            let baseScore = 100;
            
            // 錯誤選擇扣分 (減少懲罰)
            const mistakePenalty = gameState.wrongSelections * 5;
            baseScore -= mistakePenalty;
            
            // 完美獎勵
            const perfectBonus = gameState.perfect ? 30 : 0;
            baseScore += perfectBonus;
            
            // 計算最終分數（應用時間倍率）
            let totalScore = Math.round(baseScore * timeMultiplier);
            
            // 限制分數在合理範圍
            totalScore = Math.max(0, Math.min(300, totalScore));
            
            // 計算星級評價
            const starsEarned = Math.floor(totalScore / 60); // 每60分一顆星，最高5星
            
            // 評價
            let evaluation = "";
            let evaluationIcon = "";
            if (totalScore >= 270) {
                evaluation = "👑 廚神級別！完美無缺！";
                evaluationIcon = "👑";
            } else if (totalScore >= 240) {
                evaluation = "🎉 大廚級別！非常出色！";
                evaluationIcon = "🎉";
            } else if (totalScore >= 210) {
                evaluation = "👍 優秀廚師！表現很好！";
                evaluationIcon = "👍";
            } else if (totalScore >= 180) {
                evaluation = "😊 合格廚師！繼續努力！";
                evaluationIcon = "😊";
            } else if (totalScore >= 150) {
                evaluation = "💪 新手廚師！多加練習！";
                evaluationIcon = "💪";
            } else {
                evaluation = "📚 學習中！再試一次！";
                evaluationIcon = "📚";
            }
            
            // 創建星級評價
            const starRating = document.createElement('div');
            starRating.className = 'star-rating';
            starRating.style.display = 'flex';
            starRating.style.justifyContent = 'center';
            starRating.style.gap = '8px';
            starRating.style.margin = '15px 0';
            starRating.style.fontSize = '2rem';
            
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                if (i <= starsEarned) {
                    star.style.color = '#ffd700';
                } else {
                    star.style.color = '#ddd';
                }
                star.textContent = '★';
                starRating.appendChild(star);
            }
            
            completionScreen.innerHTML = `
                <div class="completion-icon">${foodSteps[currentFood].icon}</div>
                <div class="completion-message">恭喜完成 ${foodSteps[currentFood].name}！</div>
                ${starRating.outerHTML}
                <div class="completion-desc">
                    ${evaluationIcon} ${evaluation}<br><br>
                    挑戰統計：<br>
                    - 錯誤選擇: ${gameState.wrongSelections} 次<br>
                    - 完成時間: ${Math.round(timeElapsed)}秒<br>
                    - 時間倍率: ${timeMultiplier.toFixed(1)}x (${timeMultiplierInfo.description})<br>
                    - 最終分數: ${totalScore}/300分<br><br>
                    現在可以登上排行榜了！
                </div>
            `;
            
            interactionContent.appendChild(completionScreen);
            
            // 保存分數計算細節供姓名輸入表單使用
            gameState.scoreDetails = {
                baseScore: 100,
                mistakePenalty: mistakePenalty,
                perfectBonus: perfectBonus,
                timeMultiplier: timeMultiplier,
                totalScore: totalScore,
                timeElapsed: timeElapsed
            };
            
            // 顯示姓名輸入表單
            setTimeout(() => {
                interactionArea.classList.add('hidden');
                nameForm.classList.remove('hidden');
                finalScoreEl.textContent = totalScore;

                perfectBonusEl.textContent = perfectBonus > 0 ? `+${perfectBonus}` : "0";
                perfectBonusEl.style.color = perfectBonus > 0 ? "#4CAF50" : "#8B4513";
                timeMultiplierValue.textContent = `${timeMultiplier.toFixed(1)}x`;
                finalScoreDetail.textContent = totalScore;

        // 從 Firebase Realtime Database 獲取排行榜數據
        async function fetchLeaderboardFromRealtimeDB(foodType = 'all') {
            if (!firebaseInitialized) {
                console.log("Firebase未初始化，使用本地數據");
                return null;
            }
            
            try {
                // 更新同步狀態
                syncStatus.textContent = "正在同步數據...";
                syncStatus.style.color = "#ff9800";
                
                // 從 Realtime Database 獲取數據
                const snapshot = await db.ref('scores').once('value');
                const data = snapshot.val();
                
                // 將數據轉換為數組
                let scoresArray = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        scoresArray.push({
                            id: key,
                            ...data[key]
                        });
                    });
                }
                
                // 如果指定了特定食物，則過濾
                if (foodType !== 'all') {
                    scoresArray = scoresArray.filter(item => item.food === foodType);
                }
                
                // 按分數排序（從高到低）
                scoresArray.sort((a, b) => b.score - a.score);
                
                // 只取前20名
                scoresArray = scoresArray.slice(0, 20);
                
                // 更新同步狀態
                syncStatus.textContent = "數據已同步";
                syncStatus.style.color = "#4CAF50";
                
                return scoresArray;
            } catch (error) {
                console.error("從Firebase Realtime Database獲取排行榜數據失敗:", error);
                
                // 更新同步狀態
                syncStatus.textContent = "數據同步失敗，使用本地數據";
                syncStatus.style.color = "#f44336";
                
                return null;
            }
        }
        
        // 提交分數到 Firebase Realtime Database
        async function submitScoreToRealtimeDB(scoreData) {
            if (!firebaseInitialized) {
                console.log("Firebase未初始化，保存到本地");
                return false;
            }
            
            try {
                // 更新提交狀態
                submitStatus.innerHTML = '<div class="success-message">正在上傳分數到雲端...</div>';
                
                // 添加時間戳
                scoreData.timestamp = Date.now();
                scoreData.date = new Date().toISOString();
                
                // 保存到 Firebase Realtime Database
                const newScoreRef = db.ref('scores').push();
                await newScoreRef.set(scoreData);
                
                // 更新提交狀態
                submitStatus.innerHTML = '<div class="success-message">分數已成功上傳到雲端排行榜！</div>';
                
                return true;
            } catch (error) {
                console.error("提交分數到Firebase Realtime Database失敗:", error);
                
                // 更新提交狀態
                submitStatus.innerHTML = '<div class="error-message">雲端上傳失敗，已保存到本地</div>';
                
                return false;
            }
        }
        
        // 清除排行榜數據
        async function clearLeaderboard() {
            // 顯示確認對話框
            if (!confirm("確定要清除排行榜嗎？這個操作將會刪除所有本地和雲端的排行榜數據，且無法恢復！")) {
                return;
            }
            
            try {
                // 顯示清除中狀態
                syncStatus.textContent = "正在清除排行榜數據...";
                syncStatus.style.color = "#ff9800";
                
                // 清除本地數據
                leaderboardData = [];
                localStorage.removeItem('foodGameLeaderboard');
                
                // 清除 Firebase Realtime Database 數據
                if (firebaseInitialized) {
                    await db.ref('scores').remove();
                    console.log("Firebase Realtime Database 排行榜數據已清除");
                }
                
                // 顯示成功訊息
                syncStatus.textContent = "排行榜數據已清除";
                syncStatus.style.color = "#4CAF50";
                
                // 播放音效
                playSound('complete-sound');
                
                // 更新排行榜顯示
                const activeTab = document.querySelector('.leaderboard-tab.active');
                const foodType = activeTab ? activeTab.dataset.food : 'all';
                updateLeaderboard(foodType);
                
                // 顯示成功提示
                alert("排行榜數據已成功清除！");
                
            } catch (error) {
                console.error("清除排行榜數據失敗:", error);
                
                // 顯示錯誤訊息
                syncStatus.textContent = "清除數據失敗";
                syncStatus.style.color = "#f44336";
                
                alert("清除排行榜數據時發生錯誤，請重試或檢查網絡連接。");
            }
        }
        
        // 提交分數到排行榜
        async function submitScore() {
            if (isProcessingClick) return;
            isProcessingClick = true;
            
            // 防止重複提交
            if (scoreAlreadySubmitted) {
                alert("分數已經提交過了！");
                setTimeout(() => { isProcessingClick = false; }, 300);
                return;
            }
            
            const playerName = playerNameInput.value.trim() || "美食達人";
            const finalScore = parseInt(finalScoreEl.textContent);
            
            // 禁用提交按鈕防止重複點擊
            submitScoreButton.disabled = true;
            submitScoreButton.textContent = '提交中...';
            
            // 創建分數數據對象
            const scoreData = {
                name: playerName,
                character: selectedCharacter,
                food: currentFood,
                foodName: foodSteps[currentFood].name,
                score: finalScore,
                timeElapsed: Math.round(gameState.scoreDetails.timeElapsed),
                timeMultiplier: gameState.scoreDetails.timeMultiplier,
                perfect: gameState.perfect,
                wrongSelections: gameState.wrongSelections,
                deviceId: localStorage.getItem('deviceId') || generateDeviceId(),
                date: new Date().toISOString().split('T')[0] // 只保留日期部分
            };
            
            // 添加到本地排行榜數據
            leaderboardData.push(scoreData);
            
            // 排序排行榜（分數高到低）
            leaderboardData.sort((a, b) => b.score - a.score);
            
            // 限制本地排行榜數量
            if (leaderboardData.length > 50) {
                leaderboardData = leaderboardData.slice(0, 50);
            }
            
            // 保存遊戲數據到本地
            saveGameData();
            
            // 嘗試提交到 Firebase Realtime Database
            const firebaseSuccess = await submitScoreToRealtimeDB(scoreData);
            
            // 標記分數已提交
            scoreAlreadySubmitted = true;
            
            // 顯示勝利視頻
            setTimeout(() => {
                // 隱藏姓名輸入表單
                nameForm.classList.add('hidden');
                
                // 顯示視頻容器並播放視頻
                victoryVideoContainer.classList.remove('hidden');
                victoryVideo.currentTime = 0;
                victoryVideo.play().catch(e => {
                    console.log("視頻播放失敗:", e);
                    // 如果視頻播放失敗，直接顯示排行榜
                    victoryVideoContainer.classList.add('hidden');
                    leaderboardArea.classList.remove('hidden');
                    updateLeaderboard('all');
                });
                
                isProcessingClick = false;
            }, firebaseSuccess ? 1500 : 1000);
        }
        
        // 生成設備ID
        function generateDeviceId() {
            const deviceId = 'device_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('deviceId', deviceId);
            return deviceId;
        }
        
        // 更新排行榜顯示
        async function updateLeaderboard(foodType) {
            leaderboardBody.innerHTML = '';
            
            // 顯示加載中
            const loadingRow = document.createElement('tr');
            loadingRow.innerHTML = `
                <td colspan="5" style="text-align: center; padding: 30px; font-size: 1rem; color: #666;">
                    <div class="loading-spinner" style="width: 30px; height: 30px; margin: 0 auto 10px;"></div>
                    正在載入排行榜數據...
                </td>
            `;
            leaderboardBody.appendChild(loadingRow);
            
            // 嘗試從 Firebase Realtime Database 獲取數據
            let displayData = [];
            
            if (firebaseInitialized) {
                const firebaseData = await fetchLeaderboardFromRealtimeDB(foodType);
                
                if (firebaseData && firebaseData.length > 0) {
                    // 使用 Firebase 數據
                    displayData = firebaseData;
                } else {
                    // 使用本地數據作為備份
                    displayData = getLocalLeaderboardData(foodType);
                }
            } else {
                // 使用本地數據
                displayData = getLocalLeaderboardData(foodType);
            }
            
            // 清空加載中提示
            leaderboardBody.innerHTML = '';
            
            if (displayData.length === 0) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td colspan="5" style="text-align: center; padding: 30px; font-size: 1rem; color: #666;">
                        還沒有挑戰記錄，快來成為第一個吧！
                    </td>
                `;
                leaderboardBody.appendChild(row);
                return;
            }
            
            // 顯示數據
            displayData.forEach((item, index) => {
                const row = document.createElement('tr');
                
                // 排名樣式
                let rankClass = '';
                let medal = '';
                if (index === 0) {
                    rankClass = 'rank-1';
                    medal = '🥇 ';
                } else if (index === 1) {
                    rankClass = 'rank-2';
                    medal = '🥈 ';
                } else if (index === 2) {
                    rankClass = 'rank-3';
                    medal = '🥉 ';
                }
                
                // 格式化時間
                const timeFormatted = item.timeElapsed ? 
                    `${item.timeElapsed}秒` : 
                    (item.timeElapsed === 0 ? '--' : '--');
                
                row.innerHTML = `
                    <td class="${rankClass}">${medal}第${index + 1}名</td>
                    <td>${item.character} ${item.name}</td>
                    <td>${item.foodName}</td>
                    <td class="${rankClass}">${item.score}分</td>
                    <td>${timeFormatted}</td>
                `;
                
                leaderboardBody.appendChild(row);
            });
        }
        
        // 獲取本地排行榜數據
        function getLocalLeaderboardData(foodType) {
            let filteredData = [...leaderboardData];
            if (foodType !== 'all') {
                filteredData = leaderboardData.filter(item => item.food === foodType);
            }
            
            // 排序並返回前20名
            return filteredData
                .sort((a, b) => b.score - a.score)
                .slice(0, 20);
        }
        
        // 創建煙花效果
        function createFirework(x, y) {
            const colors = ['#ff0000', '#ffd700', '#00ff00', '#00aaff', '#ff00ff'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const firework = document.createElement('div');
            firework.className = 'fireworks';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            firework.style.backgroundColor = color;
            firework.style.boxShadow = `0 0 15px ${color}`;
            
            document.body.appendChild(firework);
            
            // 煙花爆炸效果
            let size = 5;
            let opacity = 1;
            const explode = () => {
                size += 8;
                opacity -= 0.05;
                
                firework.style.width = size + 'px';
                firework.style.height = size + 'px';
                firework.style.left = (x - size/2) + 'px';
                firework.style.top = (y - size/2) + 'px';
                firework.style.opacity = opacity;
                firework.style.borderRadius = size % 2 === 0 ? '50%' : '40%';
                
                if (opacity > 0) {
                    requestAnimationFrame(explode);
                } else {
                    firework.remove();
                }
            };
            
            explode();
        }
        
        // 初始化遊戲
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
